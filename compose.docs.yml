services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.35.0
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi/openapi.yaml:/spec/openapi.yaml:ro

  docs-proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./docker/docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      swagger-ui:
        condition: service_started
      app:
        condition: service_started
