global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: eventflow-api
    metrics_path: /internal/metrics

    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token

    static_configs:
      - targets:
          - app:8000

  - job_name: rabbitmq
    metrics_path: /metrics

    static_configs:
      - targets:
          - rabbitmq:15692
