rule_files:
  - /etc/prometheus/alerts.yml

evaluation_interval: 1m

tests:
  - name: EventFlow availability alerts
    interval: 1m

    input_series:
      - series: 'up{job="eventflow-api",instance="app:8000"}'
        values: "0x6"

      - series: 'up{job="rabbitmq",instance="rabbitmq:15692"}'
        values: "1x6"

    alert_rule_test:
      - eval_time: 1m
        alertname: EventFlowMetricsDown
        exp_alerts: []

      - eval_time: 4m
        alertname: EventFlowMetricsDown
        exp_alerts:
          - exp_labels:
              job: eventflow-api
              instance: app:8000
              severity: critical
            exp_annotations:
              summary: EventFlow metrics endpoint unavailable
              description: Prometheus cannot scrape EventFlow API for more than 2 minutes.

      - eval_time: 4m
        alertname: RabbitMqMetricsDown
        exp_alerts: []

  - name: RabbitMQ and outbox alerts
    interval: 1m

    input_series:
      - series: 'up{job="eventflow-api",instance="app:8000"}'
        values: "1x12"

      - series: 'up{job="rabbitmq",instance="rabbitmq:15692"}'
        values: "0x12"

      - series: 'eventflow_outbox_oldest_pending_age_seconds{job="eventflow-api",instance="app:8000"}'
        values: "360x12"

      - series: 'eventflow_outbox_publish_failures{job="eventflow-api",instance="app:8000"}'
        values: "2x12"

    alert_rule_test:
      - eval_time: 4m
        alertname: EventFlowOutboxStalled
        exp_alerts: []

      - eval_time: 7m
        alertname: EventFlowOutboxStalled
        exp_alerts:
          - exp_labels:
              job: eventflow-api
              instance: app:8000
              severity: warning
            exp_annotations:
              summary: EventFlow outbox publishing is delayed
              description: The oldest unpublished outbox message has been older than 5 minutes for 5 consecutive minutes.

      - eval_time: 11m
        alertname: EventFlowOutboxPublishFailures
        exp_alerts:
          - exp_labels:
              job: eventflow-api
              instance: app:8000
              severity: warning
            exp_annotations:
              summary: EventFlow outbox publication failures detected
              description: Unpublished outbox messages with recorded publication errors have persisted for 10 minutes.

      - eval_time: 4m
        alertname: RabbitMqMetricsDown
        exp_alerts:
          - exp_labels:
              job: rabbitmq
              instance: rabbitmq:15692
              severity: critical
            exp_annotations:
              summary: RabbitMQ metrics endpoint unavailable
              description: Prometheus cannot scrape RabbitMQ for more than 2 minutes.

  - name: Critical outbox backlog alert
    interval: 1m

    input_series:
      - series: 'eventflow_outbox_stale_messages{age="15m",job="eventflow-api",instance="app:8000"}'
        values: "0x2 1x15"

    alert_rule_test:
      - eval_time: 4m
        alertname: EventFlowOutboxCriticalBacklog
        exp_alerts: []

      - eval_time: 10m
        alertname: EventFlowOutboxCriticalBacklog
        exp_alerts:
          - exp_labels:
              age: 15m
              job: eventflow-api
              instance: app:8000
              severity: critical
            exp_annotations:
              summary: EventFlow outbox has critically delayed messages
              description: At least one unpublished outbox message has been older than 15 minutes for 5 consecutive minutes.

  - name: Growing outbox backlog alert
    interval: 1m

    input_series:
      - series: 'eventflow_outbox_messages{state="pending",job="eventflow-api",instance="app:8000"}'
        values: "0+2x25"

    alert_rule_test:
      - eval_time: 4m
        alertname: EventFlowOutboxBacklogGrowing
        exp_alerts: []

      - eval_time: 20m
        alertname: EventFlowOutboxBacklogGrowing
        exp_alerts:
          - exp_labels:
              state: pending
              job: eventflow-api
              instance: app:8000
              severity: warning
            exp_annotations:
              summary: EventFlow outbox backlog is growing
              description: The number of pending outbox messages has increased by more than 10 over 10 minutes and has remained above this growth threshold for 5 minutes.

  - name: Healthy outbox has no additional alerts
    interval: 1m

    input_series:
      - series: 'eventflow_outbox_stale_messages{age="15m",job="eventflow-api",instance="app:8000"}'
        values: "0x20"

      - series: 'eventflow_outbox_messages{state="pending",job="eventflow-api",instance="app:8000"}'
        values: "0x20"

    alert_rule_test:
      - eval_time: 15m
        alertname: EventFlowOutboxCriticalBacklog
        exp_alerts: []

      - eval_time: 15m
        alertname: EventFlowOutboxBacklogGrowing
        exp_alerts: []
