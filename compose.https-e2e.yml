services:
  webhook-receiver:
    image: node:24-alpine
    working_dir: /app
    command:
      - sh
      - /app/tests/Fixtures/https-receiver/start.sh
    volumes:
      - .:/app:ro
      - webhook_receiver_tls:/tls
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const https = require('node:https');
          const fs = require('node:fs');
          https.get({
            hostname: '127.0.0.1',
            servername: 'webhook-receiver',
            port: 8443,
            path: '/health',
            ca: fs.readFileSync('/tls/ca.crt')
          }, res => {
            res.resume();
            process.exit(res.statusCode === 200 ? 0 : 1);
          }).on('error', () => process.exit(1));
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  app:
    volumes:
      - webhook_receiver_tls:/tls:ro
    depends_on:
      webhook-receiver:
        condition: service_healthy

volumes:
  webhook_receiver_tls:
