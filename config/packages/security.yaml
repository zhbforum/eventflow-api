security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        oidc_user_provider:
            id: App\Security\OidcUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        main:
            lazy: true
            provider: oidc_user_provider
            custom_authenticators:
                - App\Security\OidcCallbackAuthenticator

            logout:
                path: api_auth_logout
                enable_csrf: true
                csrf_parameter: _csrf_token
                csrf_token_id: logout
                invalidate_session: true

    # Management API authorization will be integrated separately.
    # Do not protect the entire /api/v1/ prefix here.
    access_control: []

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
