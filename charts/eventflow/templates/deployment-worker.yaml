apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "eventflow.fullname" . }}-worker
  labels:
    {{- include "eventflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker

spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      {{- include "eventflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker

  template:
    metadata:
      labels:
        {{- include "eventflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker

      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

    spec:
      automountServiceAccountToken: false

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      terminationGracePeriodSeconds: 90

      containers:
        - name: worker

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - php
            - bin/console
            - messenger:consume
            - rabbitmq
            - --limit=100
            - --time-limit=3600
            - --memory-limit=128M
            - --failure-limit=10
            - -vv

          envFrom:
            - configMapRef:
                name: {{ include "eventflow.fullname" . }}-config

            - secretRef:
                name: {{ .Values.runtimeSecret.name | quote }}

          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

            seccompProfile:
              type: RuntimeDefault

          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}