apiVersion: v1
kind: Service

metadata:
  name: {{ include "eventflow.fullname" . }}-api

  labels:
    {{- include "eventflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api

spec:
  type: {{ .Values.api.service.type }}

  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP

  selector:
    {{- include "eventflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api