apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "eventflow.fullname" . }}-api
  labels:
    {{- include "eventflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api

spec:
  replicas: {{ .Values.api.replicas }}

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      {{- include "eventflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api

  template:
    metadata:
      labels:
        {{- include "eventflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api

      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

    spec:
      automountServiceAccountToken: false

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      terminationGracePeriodSeconds: 30

      containers:
        - name: api

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "eventflow.fullname" . }}-config

            - secretRef:
                name: {{ .Values.runtimeSecret.name | quote }}

          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

            seccompProfile:
              type: RuntimeDefault

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}