# Local k3d GitOps configuration for EventFlow.

image:
  repository: ghcr.io/zhbforum/eventflow-api
  tag: "sha-979e1f4fb636f2eea99b87a510d1617442e1b4ff"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

runtimeSecret:
  name: eventflow-runtime

keda:
  enabled: true

  worker:
    minReplicas: 1
    maxReplicas: 5
    queueName: messages
    queueLength: "5"

migrations:
  enabled: true
