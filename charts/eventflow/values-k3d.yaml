# Local k3d GitOps configuration for EventFlow.

image:
  repository: ghcr.io/zhbforum/eventflow-api
  tag: "sha-774b7193b2239b3283122facedc9b342e24b56bc"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

runtimeSecret:
  name: eventflow-runtime

keda:
  enabled: true

  worker:
    minReplicas: 1
    maxReplicas: 5
    queueName: messages
    queueLength: "5"

migrations:
  enabled: true
