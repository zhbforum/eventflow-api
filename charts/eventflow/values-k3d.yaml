# Local k3d GitOps configuration for EventFlow.

image:
  repository: ghcr.io/zhbforum/eventflow-api
  tag: "sha-90e0b3c22d45dbd4f34b23fe46ae962a846d239e"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

runtimeSecret:
  name: eventflow-runtime

keda:
  enabled: true

  worker:
    minReplicas: 1
    maxReplicas: 5
    queueName: messages
    queueLength: "5"

migrations:
  enabled: true
