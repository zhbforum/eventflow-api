# Local k3d GitOps configuration for EventFlow.

image:
  repository: ghcr.io/zhbforum/eventflow-api
  tag: "sha-a57f7b2feadf180091190286b8e6034d70829cd2"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

runtimeSecret:
  name: eventflow-runtime

keda:
  enabled: true

  worker:
    minReplicas: 1
    maxReplicas: 5
    queueName: messages
    queueLength: "5"

migrations:
  enabled: true
