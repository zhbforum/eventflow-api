# Local k3d GitOps configuration for EventFlow.

image:
  repository: ghcr.io/zhbforum/eventflow-api
  tag: "sha-46fc124294ffd2085d309014936b23856e70e2d9"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

runtimeSecret:
  name: eventflow-runtime

keda:
  enabled: true

  worker:
    minReplicas: 1
    maxReplicas: 5
    queueName: messages
    queueLength: "5"

migrations:
  enabled: true
