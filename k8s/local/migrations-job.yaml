apiVersion: batch/v1
kind: Job

metadata:
  name: eventflow-migrations
  labels:
    app.kubernetes.io/name: eventflow
    app.kubernetes.io/component: migrations

spec:
  backoffLimit: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventflow
        app.kubernetes.io/component: migrations

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      imagePullSecrets:
        - name: ghcr-pull

      containers:
        - name: migrations

          image: ghcr.io/zhbforum/eventflow-api:sha-04c3259fb32535c50c55766913cc4423a76848a2
          imagePullPolicy: IfNotPresent

          command:
            - php
            - bin/console
            - doctrine:migrations:migrate
            - --no-interaction

          env:
            - name: APP_ENV
              value: "prod"

            - name: APP_DEBUG
              value: "0"

            - name: DEFAULT_URI
              value: "http://eventflow-eventflow-api:8000"

          envFrom:
            - secretRef:
                name: eventflow-runtime

          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

            seccompProfile:
              type: RuntimeDefault

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
