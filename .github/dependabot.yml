version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

    ignore:
      - dependency-name: "symfony/*"
        update-types:
          - "version-update:semver-major"

    groups:
      symfony-maintenance:
        patterns:
          - "symfony/*"
        update-types:
          - "minor"
          - "patch"
