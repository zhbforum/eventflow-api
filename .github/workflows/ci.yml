name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit & Database & RabbitMQ & Observability
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build PHP and worker images
        run: |
          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            build app worker outbox-relay

      - name: Verify PCNTL extension
        run: |
          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            run --rm --no-deps app \
            php -r '
              if (!extension_loaded("pcntl")) {
                  fwrite(STDERR, "PCNTL is missing\n");
                  exit(1);
              }

              echo "PCNTL OK\n";
            '

      - name: Start PostgreSQL and RabbitMQ
        run: docker compose up -d --wait db rabbitmq

      - name: Verify RabbitMQ health
        run: |
          docker compose exec -T rabbitmq \
            rabbitmq-diagnostics -q ping

      - name: Validate Composer configuration
        run: |
          docker compose run --rm app \
            composer validate --no-check-publish

      - name: Install dependencies
        run: |
          docker compose run --rm -e APP_ENV=test app \
            composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan static analysis
        run: |
          docker compose run --rm --no-deps \
            -e APP_ENV=test app \
            vendor/bin/phpstan analyse \
            --configuration=phpstan.neon.dist \
            --no-progress \
            --memory-limit=1G

      - name: Run PHP_CodeSniffer
        run: |
          docker compose run --rm --no-deps \
            -e APP_ENV=test app \
            vendor/bin/phpcs \
            --standard=phpcs.xml.dist

      - name: Create test database
        run: |
          docker compose run --rm -e APP_ENV=test app \
            php bin/console doctrine:database:create --if-not-exists

      - name: Run database migrations
        run: |
          docker compose run --rm -e APP_ENV=test app \
            php bin/console doctrine:migrations:migrate --no-interaction

      - name: Validate Doctrine schema
        run: |
          docker compose run --rm -e APP_ENV=test app \
            php bin/console doctrine:schema:validate

      - name: Lint Symfony container
        run: |
          docker compose run --rm -e APP_ENV=test app \
            php bin/console lint:container

      - name: Run PHPUnit with RabbitMQ integration
        run: |
          docker compose run --rm \
            -e APP_ENV=test \
            -e RUN_RABBITMQ_INTEGRATION=1 \
            app php bin/phpunit \
            --display-phpunit-notices \
            --fail-on-phpunit-notice

      - name: Validate worker command configuration
        run: |
          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            run --rm --no-deps \
            -e APP_ENV=test \
            app php bin/console app:outbox:relay --help

          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            run --rm --no-deps \
            -e APP_ENV=test \
            app php bin/console messenger:consume --help

      - name: Smoke test graceful worker shutdown
        run: |
          compose_files=(
            -f compose.yml
            -f compose.workers.yml
            -f compose.metrics.yml
            -f compose.dashboard.yml
          )

          trap '
            docker rm -f \
              eventflow-worker-smoke \
              eventflow-outbox-relay-smoke \
              >/dev/null 2>&1 || true
          ' EXIT

          for service in worker outbox-relay; do
            name="eventflow-${service}-smoke"

            if [ "$service" = "worker" ]; then
              expected_start='Consuming messages from transport'
            else
              expected_start='Outbox relay started.'
            fi

            echo "Starting $service in test environment"

            docker compose "${compose_files[@]}" \
              run -d --no-deps \
              --name "$name" \
              -e APP_ENV=test \
              "$service"

            started=0

            for attempt in $(seq 1 20); do
              if docker logs "$name" 2>&1 \
                | grep -F "$expected_start" >/dev/null; then
                started=1
                break
              fi

              running="$(
                docker inspect \
                  --format '{{.State.Running}}' \
                  "$name"
              )"

              if [ "$running" != "true" ]; then
                echo "::error::$service exited before startup"
                docker logs "$name"
                exit 1
              fi

              sleep 1
            done

            if [ "$started" -ne 1 ]; then
              echo "::error::$service did not start"
              docker logs "$name"
              exit 1
            fi

            test "$(
              docker inspect \
                --format '{{.State.Running}}' \
                "$name"
            )" = "true"

            echo "Sending SIGTERM to $service"

            docker stop --timeout 20 "$name"

            exit_code="$(
              docker inspect \
                --format '{{.State.ExitCode}}' \
                "$name"
            )"

            docker logs "$name"

            if [ "$exit_code" != "0" ]; then
              echo "::error::$service exited with $exit_code"
              exit 1
            fi

            if [ "$service" = "worker" ]; then
              docker logs "$name" 2>&1 \
                | grep -F 'Received signal 15.' >/dev/null

              docker logs "$name" 2>&1 \
                | grep -F 'Stopping worker.' >/dev/null
            else
              docker logs "$name" 2>&1 \
                | grep -F 'Outbox relay stopped gracefully.' >/dev/null
            fi

            echo "$service stopped gracefully"

            docker rm "$name"
          done

      - name: Prepare development database for monitoring
        run: |
          docker compose run --rm -e APP_ENV=dev app \
            php bin/console doctrine:migrations:migrate --no-interaction

      - name: Generate monitoring credentials
        run: |
          mkdir -p .secrets

          openssl rand -hex 32 \
            | tr -d '\r\n' \
            > .secrets/metrics_token

          openssl rand -hex 24 \
            | tr -d '\r\n' \
            > .secrets/grafana_admin_password

          test "$(wc -c < .secrets/metrics_token)" -eq 64
          test "$(wc -c < .secrets/grafana_admin_password)" -eq 48

      - name: Validate Docker Compose configuration
        run: |
          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            -f compose.metrics.yml \
            -f compose.dashboard.yml \
            config --quiet

      - name: Validate Prometheus configuration
        run: |
          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            -f compose.metrics.yml \
            -f compose.dashboard.yml \
            run --rm --no-deps \
            --entrypoint /bin/promtool \
            prometheus \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Prometheus alert rules
        run: |
          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            -f compose.metrics.yml \
            -f compose.dashboard.yml \
            run --rm --no-deps \
            --entrypoint /bin/promtool \
            prometheus \
            check rules /etc/prometheus/alerts.yml

      - name: Test Prometheus alert rules
        run: |
          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            -f compose.metrics.yml \
            -f compose.dashboard.yml \
            run --rm --no-deps \
            --entrypoint /bin/promtool \
            prometheus \
            test rules /etc/prometheus/alerts.test.yml

      - name: Validate Grafana dashboard JSON
        run: |
          jq -e '
            .uid == "eventflow-overview"
            and .title == "EventFlow Overview"
            and (.panels | length == 14)
          ' monitoring/grafana/dashboards/eventflow-overview.json

      - name: Start observability stack
        run: |
          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            -f compose.metrics.yml \
            -f compose.dashboard.yml \
            up -d --wait app rabbitmq prometheus grafana

      - name: Verify application health endpoints
        run: |
          curl --max-time 10 -fsS \
            http://127.0.0.1:8000/api/health \
            | jq -e '
                .status == "ok"
                and .service == "eventflow-api"
              '

          curl --max-time 10 -fsS \
            http://127.0.0.1:8000/health/live \
            | jq -e '
                .status == "ok"
              '

          curl --max-time 10 -fsS \
            http://127.0.0.1:8000/health/ready \
            | jq -e '
                .status == "ready"
                and .checks.database == "up"
              '

          echo "All application health endpoints passed"

      - name: Verify Docker application healthcheck
        run: |
          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            -f compose.metrics.yml \
            -f compose.dashboard.yml \
            exec -T app php docker/app-healthcheck.php

          container_id="$(
            docker compose \
              -f compose.yml \
              -f compose.workers.yml \
              -f compose.metrics.yml \
              -f compose.dashboard.yml \
              ps -q app
          )"

          test -n "$container_id"

          health_status="$(
            docker inspect \
              --format '{{.State.Health.Status}}' \
              "$container_id"
          )"

          echo "Application container health: $health_status"

          test "$health_status" = "healthy"

      - name: Verify Prometheus targets
        run: |
          for job in eventflow-api rabbitmq; do
            healthy=0

            for attempt in $(seq 1 30); do
              if curl --max-time 5 -fsSG \
                --data-urlencode "query=up{job=\"$job\"}" \
                http://127.0.0.1:9090/api/v1/query \
                | jq -e '
                    .status == "success"
                    and any(.data.result[]; .value[1] == "1")
                  ' > /dev/null; then
                healthy=1
                break
              fi

              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "::error::Prometheus target $job is not UP"

              curl -fsS \
                http://127.0.0.1:9090/api/v1/targets \
                | jq '.data.activeTargets[] |
                    {scrapePool, health, lastError}' || true

              exit 1
            fi

            echo "Prometheus target $job is UP"
          done

      - name: Verify EventFlow metrics ingestion
        run: |
          curl -fsSG \
            --data-urlencode 'query=eventflow_webhook_endpoints_total' \
            http://127.0.0.1:9090/api/v1/query \
            | jq -e '
                .status == "success"
                and (.data.result | length > 0)
              '

      - name: Verify Outbox stale metrics ingestion
        run: |
          curl -fsSG \
            --data-urlencode 'query=eventflow_outbox_stale_messages{age="5m"}' \
            http://127.0.0.1:9090/api/v1/query \
            | jq -e '
                .status == "success"
                and (.data.result | length > 0)
              '

      - name: Verify Prometheus alert rules loaded
        run: |
          curl --max-time 10 -fsS \
            http://127.0.0.1:9090/api/v1/rules \
            | jq -e '
                .status == "success"
                and (
                  [
                    .data.groups[].rules[]
                    | select(.type == "alerting")
                  ] | length == 6
                )
              '

      - name: Verify Grafana health
        run: |
          healthy=0

          for attempt in $(seq 1 45); do
            if curl --max-time 5 -fsS \
              http://127.0.0.1:3000/api/health \
              | jq -e '.database == "ok"' > /dev/null; then
              healthy=1
              break
            fi

            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "::error::Grafana is not healthy"
            exit 1
          fi

          echo "Grafana is healthy"

      - name: Verify Grafana datasource provisioning
        run: |
          password="$(cat .secrets/grafana_admin_password)"

          curl --max-time 10 -fsS \
            -u "admin:$password" \
            http://127.0.0.1:3000/api/datasources/uid/eventflow-prometheus \
            | jq -e '
                .uid == "eventflow-prometheus"
                and .type == "prometheus"
                and .url == "http://prometheus:9090"
              '

      - name: Verify Grafana dashboard provisioning
        run: |
          password="$(cat .secrets/grafana_admin_password)"
          ready=0

          for attempt in $(seq 1 30); do
            if curl --max-time 10 -fsS \
              -u "admin:$password" \
              http://127.0.0.1:3000/api/dashboards/uid/eventflow-overview \
              | jq -e '
                  .dashboard.uid == "eventflow-overview"
                  and .dashboard.title == "EventFlow Overview"
                  and (.dashboard.panels | length == 14)
                ' > /dev/null; then
              ready=1
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::Grafana dashboard provisioning failed"
            exit 1
          fi

          echo "EventFlow Overview dashboard provisioned: 14 panels"

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            -f compose.metrics.yml \
            -f compose.dashboard.yml \
            logs --no-color --tail=100 \
            app rabbitmq prometheus grafana || true

          docker logs eventflow-worker-smoke || true
          docker logs eventflow-outbox-relay-smoke || true

      - name: Clean up containers
        if: always()
        run: |
          docker rm -f \
            eventflow-worker-smoke \
            eventflow-outbox-relay-smoke \
            >/dev/null 2>&1 || true

          docker compose \
            -f compose.yml \
            -f compose.workers.yml \
            -f compose.metrics.yml \
            -f compose.dashboard.yml \
            down --volumes --remove-orphans

  production-image:
    name: Build production Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: |
          docker build \
            --file Dockerfile.prod \
            --target runtime \
            --tag eventflow-api:ci \
            .

      - name: Verify production image
        run: |
          docker run --rm \
            --entrypoint sh \
            eventflow-api:ci \
            -ec '
              test "$(id -u)" != "0"
              test -f /app/public/index.php
              test -f /app/vendor/autoload_runtime.php
              test -f /etc/frankenphp/Caddyfile
              test ! -e /app/.env
              test ! -d /app/tests
              test ! -d /app/.secrets

              php -m | grep -Fx amqp
              php -m | grep -Fx intl
              php -m | grep -Fx pdo_pgsql
              php -m | grep -Fx pcntl
              php -m | grep -Fx zip

              echo "Production image verified"
            '

  publish-production-image:
    name: Publish image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, production-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build release image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker build \
            --file Dockerfile.prod \
            --target runtime \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image:sha-$GITHUB_SHA" \
            .

          docker tag \
            "$image:sha-$GITHUB_SHA" \
            "$image:latest"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Push release image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"

          echo "Published: $image:sha-$GITHUB_SHA"
          echo "Published: $image:latest"
